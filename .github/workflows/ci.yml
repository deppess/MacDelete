name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: macOS test and release build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - name: Show toolchain
        run: swift --version
      - name: Run quality gates
        run: Scripts/quality
